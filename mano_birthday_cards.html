<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(ellipse at 50% -10%, #4a1330 0%, #2a0a1c 55%, #1c0713 100%);
    font-family: 'Cormorant Garamond', serif;
    overflow:hidden;
  }

  .stage {
    position:relative;
    width:460px;
    max-width:88vw;
  }

  .glow {
    position:absolute;
    inset:-60px;
    background: radial-gradient(closest-side, rgba(201,163,92,0.35), transparent 70%);
    animation: breathe 4.5s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
  }

  @keyframes breathe {
    0%, 100% { opacity:0.45; transform:scale(0.96); }
    50% { opacity:0.9; transform:scale(1.04); }
  }

  .sparkle {
    position:absolute;
    width:5px;
    height:5px;
    background:#e9cd8c;
    border-radius:50%;
    box-shadow: 0 0 6px 1px rgba(233,205,140,0.9);
    opacity:0;
    animation: twinkle 2.6s ease-in-out infinite;
    z-index:2;
  }

  @keyframes twinkle {
    0%, 100% { opacity:0; transform: scale(0.4) translateY(0); }
    50% { opacity:1; transform: scale(1) translateY(-6px); }
  }

  .card {
    position:relative;
    z-index:1;
    background: linear-gradient(160deg, #fbf6ec 0%, #f3ead6 100%);
    padding:64px 40px 56px;
    text-align:center;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.6) inset,
      0 40px 80px rgba(0,0,0,0.55),
      0 10px 30px rgba(0,0,0,0.4);
    cursor:pointer;
    display:none;
  }

  .card.active {
    display:block;
  }

  .card.revealing {
    animation: reveal 1.1s cubic-bezier(.19,1,.22,1) forwards;
  }

  @keyframes reveal {
    from { opacity:0; transform: translateY(18px) scale(0.98); }
    to { opacity:1; transform: translateY(0) scale(1); }
  }

  .card::before {
    content:"";
    position:absolute;
    inset:14px;
    border:1px solid #c9a35c;
    pointer-events:none;
  }

  .corner {
    position:absolute;
    width:22px;
    height:22px;
    border:1px solid #c9a35c;
  }
  .corner.tl { top:6px; left:6px; border-right:none; border-bottom:none; }
  .corner.tr { top:6px; right:6px; border-left:none; border-bottom:none; }
  .corner.bl { bottom:6px; left:6px; border-right:none; border-top:none; }
  .corner.br { bottom:6px; right:6px; border-left:none; border-top:none; }

  .flourish {
    width:64px;
    height:auto;
    margin:0 auto 22px;
    display:block;
    opacity:0.85;
  }

  .greeting {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.7em;
    line-height:1.45;
    color:#3a2313;
    letter-spacing:0.3px;
  }

  .word {
    display:inline-block;
    opacity:0;
    transform: translateY(14px);
    animation: wordIn 0.7s ease forwards;
  }

  @keyframes wordIn {
    to { opacity:1; transform: translateY(0); }
  }

  .gold {
    background: linear-gradient(100deg, #9c7a34 20%, #e9cd8c 45%, #b8903f 55%, #9c7a34 80%);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .word.gold {
    animation: wordIn 0.7s ease forwards, shimmer 3.2s ease-in-out 1.5s 1;
  }

  @keyframes shimmer {
    0% { background-position: 200% center; }
    100% { background-position: 0% center; }
  }

  .names {
    display:block;
    margin-top:14px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.62em;
    color:#7a5a2a;
    letter-spacing:0.5px;
  }

  .rule {
    width:70px;
    height:1px;
    background:#c9a35c;
    margin:28px auto 0;
  }

  .signature {
    margin-top:22px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.95em;
    color:#8a6a35;
    opacity:0;
    animation: wordIn 0.9s ease forwards;
    animation-delay: 3.4s;
  }

  .next-btn {
    position:absolute;
    top:50%;
    right:-58px;
    transform: translateY(-50%);
    width:44px;
    height:44px;
    border-radius:50%;
    background: linear-gradient(155deg, #fbf6ec, #e9d9b5);
    border:1px solid #c9a35c;
    color:#6b4e1e;
    font-size:1.2em;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    opacity:0;
    animation: hintFade 1.8s ease forwards;
    animation-delay: 1.4s;
    z-index:3;
    transition: transform 0.2s ease;
  }

  .next-btn:hover {
    transform: translateY(-50%) scale(1.08);
  }

  @media (max-width: 560px) {
    .next-btn {
      right:auto;
      left:50%;
      top:auto;
      bottom:-58px;
      transform: translateX(-50%);
    }
    .next-btn:hover { transform: translateX(-50%) scale(1.08); }
  }

  @keyframes hintFade {
    0% { opacity:0; }
    100% { opacity:0.85; }
  }

  #card3 .greeting {
    font-size:1.5em;
    line-height:1.6;
  }

  @media (prefers-reduced-motion: reduce) {
    .card.revealing { animation:none; opacity:1; transform:none; }
    .word, .word.gold, .signature, .hint { animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="glow"></div>
  <div class="sparkle" style="top:8%; left:6%; animation-delay:0.2s;"></div>
  <div class="sparkle" style="top:18%; right:8%; animation-delay:1.1s;"></div>
  <div class="sparkle" style="bottom:14%; left:10%; animation-delay:1.8s;"></div>
  <div class="sparkle" style="bottom:22%; right:6%; animation-delay:0.7s;"></div>
  <div class="sparkle" style="top:45%; left:2%; animation-delay:2.2s;"></div>
  <div class="sparkle" style="top:50%; right:1%; animation-delay:1.4s;"></div>

  <!-- Card 1: intro -->
  <div class="card active revealing" id="card1" onclick="nextCard(1)">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <svg class="flourish" viewBox="0 0 100 30" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 15 C 25 2, 40 28, 50 15 C 60 2, 75 28, 98 15" fill="none" stroke="#c9a35c" stroke-width="1"/>
      <circle cx="50" cy="15" r="2.5" fill="#c9a35c"/>
    </svg>
    <div class="greeting">
      <span class="word" style="animation-delay:0.3s;">mere</span>
      <span class="word" style="animation-delay:0.55s;">payari</span>
      <span class="word" style="animation-delay:0.8s;">mano</span>
    </div>
    <div class="rule"></div>
    <button class="next-btn" onclick="event.stopPropagation(); nextCard(1);">&#8594;</button>
  </div>

  <!-- Card 2: birthday wish -->
  <div class="card" id="card2" onclick="nextCard(2)">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <svg class="flourish" viewBox="0 0 100 30" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 15 C 25 2, 40 28, 50 15 C 60 2, 75 28, 98 15" fill="none" stroke="#c9a35c" stroke-width="1"/>
      <circle cx="50" cy="15" r="2.5" fill="#c9a35c"/>
    </svg>
    <div class="greeting">
      <span class="word gold" style="animation-delay:0.3s;">Happy</span>
      <span class="word gold" style="animation-delay:0.55s;">Birthday</span>
      <span class="names">
        <span class="word" style="animation-delay:1.0s;">mere</span>
        <span class="word" style="animation-delay:1.25s;">Mano,</span>
        <span class="word" style="animation-delay:1.5s;">mere</span>
        <span class="word" style="animation-delay:1.75s;">payari</span>
        <span class="word" style="animation-delay:2.0s;">Sawaira</span>
      </span>
    </div>
    <div class="rule"></div>
    <div class="signature">apka payara ahsan</div>
    <button class="next-btn" style="animation-delay:3.8s;" onclick="event.stopPropagation(); nextCard(2);">&#8594;</button>
  </div>

  <!-- Card 3: promise -->
  <div class="card" id="card3">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <svg class="flourish" viewBox="0 0 100 30" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 15 C 25 2, 40 28, 50 15 C 60 2, 75 28, 98 15" fill="none" stroke="#c9a35c" stroke-width="1"/>
      <circle cx="50" cy="15" r="2.5" fill="#c9a35c"/>
    </svg>
    <div class="greeting">
      <span class="word" style="animation-delay:0.3s;">apni</span>
      <span class="word" style="animation-delay:0.55s;">mano</span>
      <span class="word" style="animation-delay:0.8s;">ko</span>
      <span class="word" style="animation-delay:1.05s;">kabhi</span>
      <span class="word" style="animation-delay:1.3s;">takleef</span>
      <span class="word" style="animation-delay:1.55s;">nahi</span>
      <span class="word" style="animation-delay:1.8s;">dou</span>
      <span class="word" style="animation-delay:2.05s;">ga,</span>
      <span class="word" style="animation-delay:2.3s;">balkay</span>
      <span class="word" style="animation-delay:2.55s;">har</span>
      <span class="word" style="animation-delay:2.8s;">takleef</span>
      <span class="word" style="animation-delay:3.05s;">deny</span>
      <span class="word" style="animation-delay:3.3s;">waly</span>
      <span class="word" style="animation-delay:3.55s;">se</span>
      <span class="word" style="animation-delay:3.8s;">bacha</span>
      <span class="word" style="animation-delay:4.05s;">lou</span>
      <span class="word" style="animation-delay:4.3s;">ga,</span>
      <span class="word gold" style="animation-delay:4.6s;">tu</span>
      <span class="word gold" style="animation-delay:4.85s;">mujhe</span>
      <span class="word gold" style="animation-delay:5.1s;">kabhi</span>
      <span class="word gold" style="animation-delay:5.35s;">nahi</span>
      <span class="word gold" style="animation-delay:5.6s;">boliya</span>
      <span class="word gold" style="animation-delay:5.85s;">ga</span>
    </div>
    <div class="rule"></div>
    <div class="signature">apka payara ahsan</div>
  </div>

</div>

<script>
  function nextCard(current) {
    const from = document.getElementById('card' + current);
    const to = document.getElementById('card' + (current + 1));
    from.classList.remove('active', 'revealing');
    to.classList.add('active');
    void to.offsetWidth; // force reflow so animation restarts
    to.classList.add('revealing');
  }
</script>

</body>
</html>
